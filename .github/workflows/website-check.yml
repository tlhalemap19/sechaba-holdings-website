name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pages and Netlify form markers
        shell: bash
        run: |
          set -euo pipefail
          cd Sechaba-Holdings-Website-Fixed-Navbar
          for file in index.html services.html about-gallery.html contact.html assets/style.css assets/navigation.js; do
            test -s "$file"
          done
          grep -q 'data-netlify="true"' contact.html
          grep -q 'name="quotation"' contact.html
          grep -q 'name="form-name"' contact.html
          grep -q 'value="quotation"' contact.html
          grep -q 'sechabaholdingsltd@gmail.com' contact.html
